<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Mailer</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1f2328; --muted:#6b7280; --line:#e2e5e9; --accent:#1a73e8; --err:#c62828; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --card:#161b22; --text:#e6edf3; --muted:#8d96a0; --line:#30363d; --accent:#4c8df6; --err:#ff6b6b; }
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; width:100%; max-width:340px; }
  h1 { font-size:20px; margin:0 0 16px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { width:100%; margin-top:12px; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .pw { position:relative; }
  .pw input { padding-right:44px; }
  .pw button { position:absolute; top:4px; right:4px; bottom:4px; width:36px; margin:0; padding:0; display:flex; align-items:center; justify-content:center; border-radius:6px; background:none; color:var(--muted); transition:background-color .15s, color .15s, transform .1s; }
  .pw button:hover { color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
  .pw button:active { transform:scale(.88); background:color-mix(in srgb, var(--accent) 22%, transparent); }
  .pw button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .pw button[aria-pressed="true"] { color:var(--accent); }
  .pw svg { animation:pwIcon .18s ease-out; }
  .pw svg[hidden] { display:none; }
  @keyframes pwIcon { from { opacity:0; transform:scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .pw button, .pw svg { transition:none; animation:none; } }
  /* Special character keys: touch phones only (950px covers the widest phones held sideways) */
  .keys { display:none; grid-template-columns:repeat(8, minmax(0, 1fr)); gap:4px; margin-top:8px; }
  @media (hover:none) and (pointer:coarse) and (max-width:950px) { .keys { display:grid; } }
  .keys button { margin:0; padding:0; height:36px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--text); font-weight:500; touch-action:manipulation; transition:background-color .1s, transform .1s; }
  .keys button:hover { border-color:var(--accent); color:var(--accent); }
  .keys button:active { transform:scale(.92); background:var(--line); }
  .guest { display:block; text-align:center; margin-top:14px; font-size:13px; color:var(--accent); text-decoration:none; }
  .guest:hover { text-decoration:underline; }
  .gh { position:fixed; right:16px; bottom:16px; z-index:20; display:flex; align-items:center; gap:6px; padding:7px 12px 7px 10px; border-radius:999px; background:var(--card); color:var(--text); border:1px solid var(--line); box-shadow:0 4px 14px rgba(0,0,0,.12); font-size:13px; font-weight:500; text-decoration:none; }
  .gh:hover { border-color:var(--accent); color:var(--accent); }
  .gh svg { flex:none; }
  @media (max-width: 760px) { .gh span { display:none; } .gh { padding:8px; right:12px; bottom:12px; } }
  .err { color:var(--err); font-size:13px; margin:8px 0 0; min-height:1em; }
</style>
</head>
<body>
<form method="post" action="/api/login">
  <h1>Attendance Mailer</h1>
  <div class="pw">
    <input type="password" id="pw" name="password" placeholder="Password" autocomplete="current-password" required autofocus autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" id="pwToggle" aria-label="Show password" aria-pressed="false" title="Show password"><svg id="eyeOn" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg><svg id="eyeOff" hidden width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.9 5.2A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3 3.9M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a10 10 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg></button>
  </div>
  <div class="keys" id="keys" role="group" aria-label="Insert a special character"></div>
  <p class="err" id="err"></p>
  <button type="submit">Sign in</button>
  <a class="guest" href="/demo">Take a tour as a guest →</a>
</form>
<script>
  // Show / hide the password. Back to hidden on submit so the browser doesn't treat it as plain text.
  const pw = document.getElementById("pw"), pwToggle = document.getElementById("pwToggle");
  const showPw = on => {
    pw.type = on ? "text" : "password";
    const label = on ? "Hide password" : "Show password";
    pwToggle.title = label; pwToggle.setAttribute("aria-label", label); pwToggle.setAttribute("aria-pressed", on);
    document.getElementById("eyeOn").toggleAttribute("hidden", on);
    document.getElementById("eyeOff").toggleAttribute("hidden", !on);
  };
  // Special characters: tap to insert at the cursor. Blocking mousedown keeps focus in the field,
  // so the phone keyboard stays open.
  const keys = document.getElementById("keys");
  for (const ch of "!@#$%^&*") {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = ch; b.setAttribute("aria-label", `Insert ${ch}`);
    b.onclick = () => {
      pw.focus();
      pw.setRangeText(ch, pw.selectionStart, pw.selectionEnd, "end");
    };
    keys.appendChild(b);
  }
  [keys, pwToggle].forEach(el => el.addEventListener("mousedown", e => e.preventDefault()));
  pwToggle.onclick = () => { showPw(pw.type === "password"); pw.focus(); };
  pw.form.addEventListener("submit", () => showPw(false));
  // Already signed in? Go straight to the app.
  fetch("/api/me", { cache: "no-store" }).then(r => { if (r.ok) location.replace("/"); }).catch(() => {});
  const e = new URLSearchParams(location.search).get("e");
  document.getElementById("err").textContent =
    e === "bad" ? "Wrong password." : e === "wait" ? "Too many attempts — try again in 15 minutes." : "";
</script>
<a class="gh" href="https://github.com/prithvi1236/attendance-mailer" target="_blank" rel="noopener noreferrer" title="View source on GitHub" aria-label="View source on GitHub">

  <span>GitHub</span>
</a>
</body>
</html>
